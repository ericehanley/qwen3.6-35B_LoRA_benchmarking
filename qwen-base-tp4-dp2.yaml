apiVersion: batch/v1
kind: Job
metadata:
  name: qwen-base-tp4-dp2-test
spec:
  template:
    spec:
      shareProcessNamespace: true
      nodeSelector:
        cloud.google.com/gke-nodepool: tpu-v6e-flex-pool
        cloud.google.com/gke-flex-start: "true"
        cloud.google.com/gke-tpu-accelerator: "tpu-v6e-slice"
        cloud.google.com/gke-tpu-topology: "2x4"
      tolerations:
      - key: "google.com/tpu"
        operator: "Equal"
        value: "present"
        effect: "NoSchedule"
      containers:
      - name: vllm-server
        image: vllm/vllm-tpu:nightly-20260612-c0c56aa-8a91228
        command: ["bash", "-c"]
        args:
        - |
          set -ex
          TARGET_FILE="/workspace/vllm/vllm/forward_context.py"
          if [ -f "$TARGET_FILE" ]; then
            echo "Patching forward_context.py..."
            sed -i "s/and (attn_metadata is not None or num_tokens is not None)/and num_tokens is not None/g" "$TARGET_FILE"
            echo "Patch applied."
          else
            echo "Error: $TARGET_FILE not found!"
            exit 1
          fi
          
          exec vllm serve Qwen/Qwen3.6-35B-A3B \
            --tensor-parallel-size 4 \
            --data-parallel-size 2 \
            --host 0.0.0.0 \
            --port 8000 \
            --served-model-name Qwen/Qwen3.6-35B-A3B \
            --max-model-len 2048 \
            --max-num-batched-tokens 2048 \
            --gpu-memory-utilization 0.60 \
            --max-num-seqs 64 \
            --trust-remote-code
        env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: HF_TOKEN
        - name: HF_HOME
          value: /hf-cache
        - name: VLLM_ENGINE_READY_TIMEOUT_S
          value: "1200"
        resources:
          limits:
            google.com/tpu: "8"
          requests:
            google.com/tpu: "8"
        volumeMounts:
        - name: hf-cache
          mountPath: /hf-cache
        - name: osmosis-volume
          mountPath: /osmosis
      - name: test-client
        image: vllm/vllm-tpu:nightly-20260612-c0c56aa-8a91228
        command:
        - "bash"
        - "-c"
        - |
          set -ex
          trap 'pkill -f vllm' EXIT
          
          echo "Waiting for vLLM server to start and run warmup..."
          until curl -sf http://localhost:8000/health; do
            sleep 5
          done
          echo "Server started successfully with TP=4, DP=2!"
        volumeMounts:
        - name: osmosis-volume
          mountPath: /osmosis
      restartPolicy: Never
      volumes:
      - name: hf-cache
        emptyDir:
          medium: Memory
      - name: osmosis-volume
        emptyDir:
          medium: Memory
