apiVersion: batch/v1
kind: Job
metadata:
  name: qwen-base-bench-tp4-dp2
spec:
  template:
    spec:
      shareProcessNamespace: true
      nodeSelector:
        cloud.google.com/gke-nodepool: tpu-v6e-flex-pool
        cloud.google.com/gke-flex-start: "true"
        cloud.google.com/gke-tpu-accelerator: "tpu-v6e-slice"
        cloud.google.com/gke-tpu-topology: "2x4"
      tolerations:
      - key: "google.com/tpu"
        operator: "Equal"
        value: "present"
        effect: "NoSchedule"
      containers:
      - name: vllm-server
        image: vllm/vllm-tpu:nightly-20260612-c0c56aa-8a91228
        command: ["bash", "-c"]
        args:
        - |
          set -ex
          TARGET_FILE="/workspace/vllm/vllm/forward_context.py"
          if [ -f "$TARGET_FILE" ]; then
            echo "Patching forward_context.py..."
            sed -i "s/and (attn_metadata is not None or num_tokens is not None)/and num_tokens is not None/g" "$TARGET_FILE"
            echo "Patch applied."
          else
            echo "Error: $TARGET_FILE not found!"
            exit 1
          fi
          
          exec vllm serve Qwen/Qwen3.6-35B-A3B \
            --tensor-parallel-size 4 \
            --data-parallel-size 2 \
            --host 0.0.0.0 \
            --port 8000 \
            --served-model-name Qwen/Qwen3.6-35B-A3B \
            --max-model-len 16384 \
            --max-num-batched-tokens 16384 \
            --gpu-memory-utilization 0.60 \
            --max-num-seqs 64 \
            --enable-prefix-caching \
            --trust-remote-code
        env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: HF_TOKEN
        - name: HF_HOME
          value: /hf-cache
        - name: VLLM_ENGINE_READY_TIMEOUT_S
          value: "3600"
        resources:
          limits:
            google.com/tpu: "8"
          requests:
            google.com/tpu: "8"
        volumeMounts:
        - name: hf-cache
          mountPath: /hf-cache
        - name: osmosis-volume
          mountPath: /osmosis
      - name: native-bench-client
        image: vllm/vllm-tpu:nightly-20260612-c0c56aa-8a91228
        env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: HF_TOKEN
        - name: JAX_PLATFORMS
          value: "cpu"
        command:
        - "bash"
        - "-c"
        - |
          set -ex
          trap 'pkill -f vllm' EXIT
          
          echo "Waiting for vLLM server to start and compile..."
          until curl -sf http://localhost:8000/health; do
            sleep 5
          done
          echo "Server is ready."
          echo "Running a single prompt sanity check..."
          curl -s -X POST http://localhost:8000/v1/chat/completions \
              -H "Content-Type: application/json" \
              -d '{
                "model": "Qwen/Qwen3.6-35B-A3B",
                "messages": [{"role": "user", "content": "Explain why the sky is blue in one sentence."}],
                "max_tokens": 50,
                "temperature": 0.0
              }' | python3 -c "import sys, json; print('SANITY CHECK RESPONSE:', json.load(sys.stdin)['choices'][0]['message']['content'])"
          
          echo "Starting native Qwen3.6-35B base prefix caching benchmarks..."
          mkdir -p /workspace/output
          
          for C in 8 16 32 64; do
            NUM_PROMPTS=$((C * 10))
            echo "Running benchmark at concurrency ${C} with ${NUM_PROMPTS} prompts..."
            vllm bench serve \
                --backend openai \
                --model Qwen/Qwen3.6-35B-A3B \
                --tokenizer Qwen/Qwen3.6-35B-A3B \
                --dataset-name random \
                --random-input-len 6400 \
                --random-prefix-len 2600 \
                --random-output-len 600 \
                --ignore-eos \
                --max-concurrency $C \
                --num-prompts $NUM_PROMPTS \
                --metric-percentiles 50,90,95,99 \
                --percentile-metrics ttft,tpot,itl,e2el \
                --save-result \
                --result-dir /workspace/output \
                --result-filename "base_tp4_dp2_c${C}_results.json" \
                --base-url http://localhost:8000
          done
          
          echo "Benchmarks completed. Installing google-cloud-storage..."
          pip install google-cloud-storage
          
          echo "Uploading results to GCS..."
          python3 -c '
          import os
          from google.cloud import storage
          
          def upload_dir(bucket_name, local_dir, gcs_prefix):
              client = storage.Client()
              bucket = client.bucket(bucket_name)
              for root, dirs, files in os.walk(local_dir):
                  for file in files:
                      local_path = os.path.join(root, file)
                      rel_path = os.path.relpath(local_path, local_dir)
                      blob_path = os.path.join(gcs_prefix, rel_path)
                      blob = bucket.blob(blob_path)
                      blob.upload_from_filename(local_path)
                      print(f"Uploaded {local_path} to gs://{bucket_name}/{blob_path}")
          
          upload_dir("llama-vllm-results-bucket", "/workspace/output", "qwen3.6-35b-base-bench/v6e/tp4-dp2_results")
          '
          echo "All results uploaded successfully. Shutting down co-located vLLM server process..."
          pkill -f vllm
          echo "Cleanup complete."
        volumeMounts:
        - name: output-volume
          mountPath: /workspace/output
        - name: osmosis-volume
          mountPath: /osmosis
      restartPolicy: Never
      volumes:
      - name: output-volume
        emptyDir: {}
      - name: hf-cache
        emptyDir:
          medium: Memory
      - name: osmosis-volume
        emptyDir:
          medium: Memory
